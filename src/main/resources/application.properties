spring.application.name=client-portal

# Server Configuration
server.port=8080

# Default Database: Embedded H2 for immediate, zero-friction execution
# (To use MySQL: change to 'spring.profiles.active=mysql' or pass --spring.profiles.active=mysql)
spring.datasource.url=jdbc:h2:mem:client_portal_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File Upload Settings for Deliverables & Document Repository
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Storage directory for uploaded client documents
app.upload.dir=./uploads
