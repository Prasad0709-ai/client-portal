<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${projectForm.id != null ? 'Edit Project' : 'New Project'}, ~{::section}, 'projects')}">
<body>

<section>
    <div style="max-width: 760px; margin: 0 auto;">
        <div class="card">
            <div class="card-header">
                <div>
                    <h2 th:text="${projectForm.id != null ? 'Edit Project Engagement' : 'Launch New Client Engagement'}">Project Form</h2>
                    <p style="font-size: 0.88rem; margin-top: 4px;">Define scope, budget, client organization, and delivery timeline.</p>
                </div>
                <a th:href="@{/projects}" class="btn btn-secondary btn-sm">&larr; Back to Projects</a>
            </div>

            <form th:action="${projectForm.id != null ? '/projects/' + projectForm.id + '/edit' : '/projects/new'}"
                  th:object="${projectForm}"
                  method="post">
                <input type="hidden" th:field="*{id}" th:if="${projectForm.id != null}">

                <div class="form-group">
                    <label class="form-label" for="title">Project Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Acme Corp - Brand Identity & Mobile App" required>
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="clientId">Client Organization</label>
                    <select id="clientId" th:field="*{clientId}" class="form-select" required>
                        <option value="">-- Select Client Account --</option>
                        <option th:each="client : ${clients}"
                                th:value="${client.id}"
                                th:text="${client.fullName} + ' (' + ${client.companyName} + ')'">Client Name</option>
                    </select>
                    <div th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}" class="form-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Scope &amp; Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Detailed project overview, milestones, and deliverable commitments..."></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 18px;">
                    <div class="form-group">
                        <label class="form-label" for="startDate">Start Date</label>
                        <input type="date" id="startDate" th:field="*{startDate}" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="targetDate">Target Completion Date</label>
                        <input type="date" id="targetDate" th:field="*{targetDate}" class="form-control">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 18px;">
                    <div class="form-group">
                        <label class="form-label" for="budget">Total Contract Budget</label>
                        <input type="number" step="0.01" id="budget" th:field="*{budget}" class="form-control" placeholder="25000.00">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="currency">Currency</label>
                        <input type="text" id="currency" th:field="*{currency}" class="form-control" value="USD">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="status">Status</label>
                        <select id="status" th:field="*{status}" class="form-select">
                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}">Planning</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 14px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-subtle);">
                    <a th:href="@{/projects}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" th:text="${projectForm.id != null ? 'Update Project' : 'Launch Project'}">Submit</button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
