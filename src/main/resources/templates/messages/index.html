<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('Project Collaboration', ~{::section}, 'messages')}">
<body>

<section>
    <div style="display: grid; grid-template-columns: 300px 1fr; gap: 24px; min-height: 600px;">
        <!-- Project Channel Selector -->
        <div class="card" style="padding: 18px;">
            <h3 style="font-size: 1rem; margin-bottom: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em;">
                Project Channels
            </h3>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <a th:each="proj : ${projects}"
                   th:href="@{/messages(projectId=${proj.id})}"
                   style="padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); display: block; transition: 0.2s;"
                   th:classappend="${activeProject != null and activeProject.id == proj.id} ? 'card-active' : ''"
                   th:styleappend="${activeProject != null and activeProject.id == proj.id} ? 'background: var(--primary-gradient-subtle); border-color: rgba(99, 102, 241, 0.4);' : 'background: rgba(255, 255, 255, 0.02);'">
                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;" th:text="${proj.title}">Project Title</div>
                    <div style="font-size: 0.74rem; color: var(--text-muted); margin-top: 4px;" th:text="${proj.client.companyName}">Client Name</div>
                </a>
            </div>
        </div>

        <!-- Chat Conversation Area -->
        <div class="card" style="padding: 0; display: flex; flex-direction: column; overflow: hidden;">
            <!-- Active Project Channel Header -->
            <div style="padding: 18px 24px; border-bottom: 1px solid var(--border-subtle); background: rgba(15, 23, 42, 0.6); display: flex; justify-content: space-between; align-items: center;">
                <div th:if="${activeProject != null}">
                    <h3 style="font-size: 1.1rem; color: #ffffff;" th:text="${activeProject.title}">Active Project Channel</h3>
                    <p style="font-size: 0.8rem; margin-top: 2px;">
                        <span>Client: <strong style="color: #ffffff;" th:text="${activeProject.client.companyName}">Client</strong></span>
                        <span th:text="' &bull; PM: ' + ${activeProject.agencyManager != null ? activeProject.agencyManager.fullName : 'Apex PM'}"></span>
                    </p>
                </div>
                <div th:unless="${activeProject != null}">
                    <h3>No Channel Selected</h3>
                </div>

                <div th:if="${activeProject != null}">
                    <a th:href="@{/projects/{id}(id=${activeProject.id})}" class="btn btn-secondary btn-sm">View Project &rarr;</a>
                </div>
            </div>

            <!-- Messages Stream -->
            <div class="chat-messages" style="flex: 1; min-height: 400px; max-height: 480px;">
                <div th:if="${#lists.isEmpty(messages)}" style="text-align: center; margin: auto; color: var(--text-muted); padding: 40px;">
                    <div style="font-size: 2rem; margin-bottom: 8px;">💬</div>
                    <div>No messages in this project channel yet.</div>
                    <div style="font-size: 0.8rem; margin-top: 4px;">Start the conversation with your client or PM below!</div>
                </div>

                <div th:each="msg : ${messages}"
                     class="chat-bubble-container"
                     th:classappend="${msg.sender.id == currentUser.id} ? 'mine'">
                    <div class="avatar" th:classappend="${msg.sender.isAdmin()} ? 'avatar-admin'" style="width: 34px; height: 34px; font-size: 13px;">
                        <span th:text="${#strings.substring(msg.sender.fullName, 0, 1)}">U</span>
                    </div>
                    <div>
                        <div class="chat-bubble">
                            <div th:text="${msg.content}">Message body text...</div>
                        </div>
                        <div class="chat-meta">
                            <strong th:text="${msg.sender.fullName}">Name</strong>
                            <span th:text="${#temporals.format(msg.sentAt, 'MMM dd, HH:mm')}">10:45 AM</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Message Input Form -->
            <div th:if="${activeProject != null}">
                <form th:action="@{/messages/send}" method="post" class="chat-input-bar">
                    <input type="hidden" name="projectId" th:value="${activeProject.id}">
                    <input type="hidden" name="source" value="messages">
                    <input type="text" name="content" class="form-control" placeholder="Write a message, request an update, or clarify requirements..." required autocomplete="off">
                    <button type="submit" class="btn btn-primary" style="flex-shrink: 0;">
                        <span>Send</span>
                        <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>

</body>
</html>
