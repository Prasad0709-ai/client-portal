<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Publish Deliverable', ~{::section}, 'deliverables')}">
<body>

<section>
    <div style="max-width: 720px; margin: 0 auto;">
        <div class="card">
            <div class="card-header">
                <div>
                    <h2>Submit Client Deliverable</h2>
                    <p style="font-size: 0.88rem; margin-top: 4px;">Publish an asset, staging build, or documentation for client review.</p>
                </div>
                <a th:href="@{/deliverables}" class="btn btn-secondary btn-sm">&larr; Back to Deliverables</a>
            </div>

            <form th:action="@{/deliverables/new}" th:object="${deliverableForm}" method="post">
                <div class="form-group">
                    <label class="form-label" for="projectId">Target Project</label>
                    <select id="projectId" th:field="*{projectId}" class="form-select" required>
                        <option value="">-- Select Project --</option>
                        <option th:each="proj : ${projects}"
                                th:value="${proj.id}"
                                th:text="${proj.title} + ' (' + ${proj.client.companyName} + ')'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="title">Deliverable Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Figma Design System v1.2 Export" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="version">Version Tag</label>
                        <input type="text" id="version" th:field="*{version}" class="form-control" placeholder="v1.0" value="v1.0">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="assetUrl">External URL / Staging Link</label>
                        <input type="url" id="assetUrl" th:field="*{assetUrl}" class="form-control" placeholder="https://staging.acme.design">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Release Notes / Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Highlight what has been completed, key items to test, and context for the client..."></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 14px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle);">
                    <a th:href="@{/deliverables}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Publish for Review</button>
                </div>
            </form>
        </div>
    </div>
</section>

</body>
</html>
